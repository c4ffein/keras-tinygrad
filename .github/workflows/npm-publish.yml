# Publish the JS package (js/) to npm — token-free via npm Trusted
# Publishing (OIDC), mirroring the PyPI workflow's discipline: verify the
# artifact, then publish with provenance attestations. No npm token ever
# exists on any dev box.
#
# One-time setup (all in the browser, nothing on any box):
#   1. npmjs.com account with 2FA.
#   2. EITHER configure Trusted Publishing for the package (npm package
#      settings -> Publishing access -> add GitHub Actions publisher:
#      repo c4ffein/keras-tinygrad, workflow npm-publish.yml) — if npm
#      only allows this for EXISTING packages, then for the very first
#      publish: create a granular automation token scoped to publish,
#      store it as the NPM_TOKEN repo secret on GitHub (browser -> GitHub,
#      never a dev box), let this workflow's fallback use it once, then
#      configure Trusted Publishing and DELETE the token.
#      (Verify current npm docs — their trusted-publishing rollout has
#      been evolving.)
#
# Release flow: bump version in js/package.json, then
#     git tag js-v<version> && git push origin js-v<version>

name: Publish JS package to npm

on:
  push:
    tags: ["js-v*"]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Tag must match js/package.json version
        run: |
          v=$(bun -e "console.log(JSON.parse(await Bun.file('js/package.json').text()).version)")
          test "js-v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != js version js-v$v"; exit 1; }
      - name: js test suite (export surface, LCG Python-parity, loadBundle contract)
        working-directory: js
        run: bun test/run.mjs
      - name: Pack (dry run, bun)
        working-directory: js
        run: bun pm pack --dry-run
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Pack (dry run, npm — the tool the publish job actually uses)
        working-directory: js
        run: npm pack --dry-run
      - name: Test suite under node too (package.json's `npm test`)
        working-directory: js
        run: npm test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write # trusted publishing / provenance
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "24" # bundles npm >= 11.5.1 (trusted publishing requirement)
          registry-url: "https://registry.npmjs.org"
      - name: Publish with provenance
        working-directory: js
        env:
          # Empty when Trusted Publishing is configured (OIDC handles auth).
          # For the one-time first publish before TP exists, set the
          # NPM_TOKEN repo secret; delete it after TP is configured.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
