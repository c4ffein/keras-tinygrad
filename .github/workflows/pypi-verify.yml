# THE PYPI-SIDE CHECK (pattern borrowed from c4ffein/pyscotch): the literal
# end-user journey, from the REAL index — `pip install keras-tinygrad`, no
# repo checkout anywhere, every byte from PyPI — then train a model on the
# tinygrad backend, and separately prove the patched keras still behaves as
# stock keras when another backend is selected.
#
# Runs twice daily, but SKIPS unless the dependency resolution changed:
# the published wheel is frozen, so the only thing that can break it is the
# ecosystem resolving differently than last time. The fingerprint of the
# would-be-installed set (pip --dry-run --report) is compared against the
# ledger on the `ci-state` branch; every completed run is recorded there
# (version set, date, pass/fail) — a browsable history of which
# resolutions were proven. Manual dispatch always runs.

name: Verify published PyPI release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "keras-tinygrad version on PyPI (empty = latest)"
        required: false
        default: ""
  schedule:
    - cron: "17 6,18 * * *"

permissions: {}

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      fp: ${{ steps.decide.outputs.fp }}
      resolved: ${{ steps.decide.outputs.resolved }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Resolve (dry run) and compare against ci-state ledger
        id: decide
        run: |
          python -m pip install --upgrade pip -q
          # Fingerprint the SAME spec the verify jobs will install: a pinned
          # manual dispatch must not write its result under the fingerprint
          # of the latest release it never tested.
          spec="keras-tinygrad"
          if [ -n "${{ inputs.version }}" ]; then spec="keras-tinygrad==${{ inputs.version }}"; fi
          pip install --dry-run --quiet --report report.json "$spec"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib, json, os, urllib.request

          report = json.load(open("report.json"))
          versions = sorted(
              f"{p['metadata']['name']}=={p['metadata']['version']}"
              for p in report["install"]
          )
          fp = hashlib.sha256("\n".join(versions).encode()).hexdigest()[:16]
          print(f"fp={fp}")
          print(f"resolved={' '.join(versions)}")
          seen_pass = False
          try:
              url = ("https://raw.githubusercontent.com/c4ffein/keras-tinygrad/"
                     "ci-state/pypi-verify-state.json")
              state = json.load(urllib.request.urlopen(url))
              seen_pass = state.get(fp, {}).get("result") == "pass"
          except Exception:
              pass  # no ledger yet -> run
          manual = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
          print(f"run={'true' if (manual or not seen_pass) else 'false'}")
          PY

  tinygrad-journey:
    name: Train on the tinygrad backend, from PyPI
    needs: fingerprint
    if: needs.fingerprint.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      # Deliberately NO actions/checkout: a user has none of this repo.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install clang (tinygrad CPU backend compiler)
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: pip install keras-tinygrad from PyPI
        run: |
          spec="keras-tinygrad"
          if [ -n "${{ inputs.version }}" ]; then spec="keras-tinygrad==${{ inputs.version }}"; fi
          python -m pip install --upgrade pip
          pip install "$spec"
          pip show keras-tinygrad | head -2
      - name: Import-hook journey — compile, fit, predict
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import keras_tinygrad  # installs the import hook

          import keras
          import numpy as np

          assert keras.config.backend() == "tinygrad", keras.config.backend()
          x = np.random.default_rng(0).normal(size=(64, 8)).astype("float32")
          y = x @ np.arange(8, dtype="float32")[:, None] + 1.0
          model = keras.Sequential(
              [
                  keras.layers.Input((8,)),
                  keras.layers.Dense(16, activation="relu"),
                  keras.layers.Dense(1),
              ]
          )
          model.compile(optimizer="adam", loss="mse")
          h = model.fit(x, y, epochs=3, batch_size=16, verbose=0)
          losses = h.history["loss"]
          assert losses[-1] < losses[0], losses  # training moves the loss
          out = model.predict(x[:2], verbose=0)
          assert out.shape == (2, 1), out.shape
          t = keras.ops.convert_to_tensor([1.0, 2.0])
          assert type(t).__module__.startswith("tinygrad"), type(t)
          assert keras.utils.standardize_dtype(t.dtype) == "float32"
          print("from-PyPI tinygrad journey OK:", keras_tinygrad.__version__)
          PY

  stock-keras-unharmed:
    name: Patched keras == stock keras on another backend
    needs: fingerprint
    if: needs.fingerprint.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      # Deliberately NO actions/checkout.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: pip install keras-tinygrad + a non-tinygrad backend's deps
        run: |
          spec="keras-tinygrad"
          if [ -n "${{ inputs.version }}" ]; then spec="keras-tinygrad==${{ inputs.version }}"; fi
          python -m pip install --upgrade pip
          # keras' numpy backend borrows scipy (linalg) and jax (it borrows jax's fft).
          pip install "$spec" scipy "jax[cpu]"
      - name: Explicit KERAS_BACKEND wins; patched keras trains as stock
        working-directory: ${{ runner.temp }}
        env:
          KERAS_BACKEND: numpy
        run: |
          python - <<'PY'
          import keras_tinygrad  # hook installs, but explicit backend wins

          import keras
          import numpy as np

          assert keras.config.backend() == "numpy", keras.config.backend()
          x = np.ones((16, 4), dtype="float32")
          model = keras.Sequential(
              [keras.layers.Input((4,)), keras.layers.Dense(2)]
          )
          out = model.predict(x, verbose=0)
          assert out.shape == (16, 2), out.shape
          print("stock-keras-unharmed OK (numpy backend, patched keras)")
          PY

  record:
    name: Record result on ci-state ledger
    needs: [fingerprint, tinygrad-journey, stock-keras-unharmed]
    if: always() && needs.fingerprint.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Append result to ci-state branch
        env:
          FP: ${{ needs.fingerprint.outputs.fp }}
          RESOLVED: ${{ needs.fingerprint.outputs.resolved }}
          RESULT: ${{ (needs.tinygrad-journey.result == 'success' && needs.stock-keras-unharmed.result == 'success') && 'pass' || 'fail' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ci-state && git checkout ci-state || git checkout --orphan ci-state
          git rm -rf --cached . 2>/dev/null || true
          find . -maxdepth 1 ! -name '.git' ! -name '.' ! -name 'pypi-verify-state.json' ! -name 'keras-versions.json' -exec rm -rf {} + 2>/dev/null || true
          # Re-stage EVERY surviving ledger: `git rm --cached .` unstaged
          # keras-versions.json too, and adding only our own file deleted
          # the keras-watch ledger from the branch on every commit.
          git add -A .
          python - <<'PY'
          import json, os, datetime
          try:
              state = json.load(open("pypi-verify-state.json"))
          except Exception:
              state = {}
          state[os.environ["FP"]] = {
              "result": os.environ["RESULT"],
              "date": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "resolved": os.environ["RESOLVED"].split(),
          }
          json.dump(state, open("pypi-verify-state.json", "w"), indent=1, sort_keys=True)
          PY
          git add pypi-verify-state.json
          git commit -m "pypi-verify: $RESULT ($FP)"
          # Two workflows write this branch (keras-watch too): rebase-retry
          # instead of failing non-fast-forward on a race.
          git push origin ci-state \
            || (git pull --rebase origin ci-state && git push origin ci-state)
