[build-system]
# >=77: first setuptools release accepting the PEP 639 SPDX `license` string
# below (68-76 fail the build on it).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "keras-tinygrad"
version = "0.1.1"
description = "Out-of-tree tinygrad backend for stock Keras 3 (KERAS_BACKEND=tinygrad)"
readme = "README.md"
authors = [{ name = "c4ffein" }]
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = ["keras", "tinygrad", "backend", "deep-learning", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "keras>=3.15,<3.16",
    # Upper-bounded like keras: the trainer's JIT safety story is built on
    # 0.13 internals (JitError-on-capture semantics, loss.gradient API);
    # tinygrad is pre-1.0 and breaks APIs freely, and a semantic change
    # would surface at runtime, not import. Bump only with a referee re-run.
    "tinygrad>=0.13,<0.14",
    "numpy",
]

[project.urls]
Repository = "https://github.com/c4ffein/keras-tinygrad"
Issues = "https://github.com/c4ffein/keras-tinygrad/issues"

# If the installed keras supports backend plugins natively (the
# `keras.backends` entry-point group resolved by keras/src/backend/plugins.py
# — today only the plugin-backends fork, hopefully upstream someday), keras
# discovers the backend through this entry point and the import hook stands
# down entirely (see __init__.py). On stock keras the entry point is inert.
[project.entry-points."keras.backends"]
tinygrad = "keras_tinygrad._backend"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
keras_tinygrad = ["_backend/*.py"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    # keras' numpy backend imports scipy (linalg) and jax (it borrows jax's
    # fft); the loader tests exercise that backend in the
    # explicit-KERAS_BACKEND scenarios, so tests need both.
    "scipy",
    "jax",
]

[tool.ruff]
line-length = 120
# The backend sources are the source of truth (no keras clone since
# 2026-08-30) and must stay byte-stable for upstream diffs; lint/format
# must never touch them. scripts/referee.sh is what tests them.
extend-exclude = [
    "src/keras_tinygrad/_backend",
    "src/keras_tinygrad/_vendor",  # third-party bytes, pinned to the experiment copies
    # spike code (incl. vendored exporter that must stay byte-aligned with
    # nnvp's TinygradRuntime); linted by eye, never reformatted by tooling
    "experiments",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
# Import order is load-bearing: `import keras_tinygrad` must precede
# `import keras` everywhere (it installs the import hook). A dedicated
# section between stdlib and third-party makes the sorter ENFORCE that
# order instead of alphabetizing keras before keras_tinygrad.
section-order = [
    "future",
    "standard-library",
    "keras-hook",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
"keras-hook" = ["keras_tinygrad"]
